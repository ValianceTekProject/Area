services:
  client_web:
    build: ./front
    ports:
      - "8081:3000"
    environment:
      - API_URL=http://back:8080
    networks:
      - area
    depends_on:
      - server
      - client_mobile
    volumes:
      - ./APK/app-release.apk:/app/public/client.apk:ro

  server:
    build: ./back
    depends_on:
      - db
    ports:
      - "8080:8080"
    env_file:
      - .env
    networks:
      - area

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: dev
      POSTGRES_DB: area
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    networks:
      - area

  client_mobile:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    volumes:
      - gradle-cache:/root/.gradle
      - ./APK/:/output
    environment:
      - API_IP=192.168.1.41
    networks:
      - area

networks:
  area:
    driver: bridge

volumes:
  gradle-cache:
